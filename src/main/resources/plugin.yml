name: Storage
version: '${project.version}'
main: net.danh.storage.Storage
author: VoChiDanh, hongminh54
description: "${project.description}"
api-version: '1.13'
folia-supported: true
load: STARTUP
softdepend:
  - WorldGuard
  - PlaceholderAPI
  - LuckPerms
  - MMOItems
  - MythicLib
  - PlayerPoints
  - Vault
  - VaultUnlocked
  - SuperiorSkyblock2

commands:
  storage:
    description: Main command
    aliases:
      - kho
      - kks
      - khokhoangsan



permissions:
  storage.user:
    description: User permission
    default: true
    children:
      storage.toggle: true
      storage.deposit: true
      storage.withdraw: true
      storage.sell: true
      storage.island: true
      storage.view: true
      storage.transfer.use: true
      storage.transfer.multi: true
      storage.transfer.log: true
      storage.transfer.log.others: true
      storage.enchant.use: true
      storage.event.view: true
      storage.craft.use: true
      storage.friends.use: true
      storage.friends.add: true
      storage.friends.accept: true
      storage.friends.deny: true
      storage.friends.remove: true
      storage.friends.list: true
      storage.friends.deposit: true
      storage.friends.withdraw: true
      storage.friends.history: true
      storage.friends.settings: true
      storage.friends.open: true

  storage.toggle:
    description: Toggle permission
    default: true

  storage.deposit:
    description: Deposit items into storage
    default: true

  storage.withdraw:
    description: Withdraw items from storage
    default: true

  storage.sell:
    description: Sell items from storage
    default: true

  storage.autosell:
    description: Toggle per-item auto sell for Storage
    default: op

  storage.admin:
    description: Admin permission
    default: op
    children:
      storage.admin.add: true
      storage.admin.remove: true
      storage.admin.set: true
      storage.admin.max: true
      storage.admin.resetlimit: true
      storage.admin.reload: true
      storage.admin.specialmaterial: true
      storage.admin.reset: true
      storage.admin.enchant: true
      storage.event.admin: true
      storage.transfer.admin: true
      storage.transfer.log.others: true
      storage.convert: true
      storage.craft.admin: true
      storage.preventrebreak.bypass: true

  storage.admin.add:
    description: Admin add permission command
    default: op

  storage.admin.remove:
    description: Admin remove permission command
    default: op

  storage.admin.set:
    description: Admin set permission command
    default: op

  storage.admin.max:
    description: Admin max permission command
    default: op

  storage.admin.resetlimit:
    description: Admin reset storage max limit override
    default: op

  storage.admin.reload:
    description: Admin reload permission command
    default: op

  storage.admin.specialmaterial:
    description: Admin special material permission command
    default: op

  storage.admin.reset:
    description: Admin reset permission command
    default: op

  storage.admin.enchant:
    description: Admin enchant permission command
    default: op

  storage.transfer.use:
    description: Use transfer feature
    default: true

  storage.enchant.use:
    description: Use enchant items
    default: true

  storage.event.admin:
    description: Admin event management permission
    default: op

  storage.event.view:
    description: View event status permission
    default: true

  storage.transfer.multi:
    description: Use multi transfer feature
    default: true

  storage.transfer.log:
    description: View own transfer logs
    default: true

  storage.transfer.log.others:
    description: View other players transfer logs
    default: true

  storage.transfer.admin:
    description: Bypass transfer cooldown and limitations
    default: op

  storage.convert:
    description: Use convert materials feature
    default: op

  storage.view:
    description: View other players' storage
    default: true










  storage.craft.use:
    description: Use crafting feature
    default: true

  storage.craft.admin:
    description: Admin commands for crafting system
    default: op

































  storage.preventrebreak.bypass:
    description: Bypass prevent rebreak placed-block protection
    default: op

  storage.friends.use:
    description: Use friend storage feature
    default: true

  storage.friends.add:
    description: Send friend requests
    default: true

  storage.friends.accept:
    description: Accept friend requests
    default: true

  storage.friends.deny:
    description: Deny friend requests
    default: true

  storage.friends.remove:
    description: Remove friends
    default: true

  storage.friends.list:
    description: View friend list
    default: true

  storage.friends.deposit:
    description: Deposit items into friends storage
    default: true

  storage.friends.withdraw:
    description: Withdraw items from friends storage
    default: true

  storage.friends.history:
    description: View friend storage history
    default: true

  storage.friends.settings:
    description: Manage friend storage access settings
    default: true

  storage.friends.open:
    description: Open friend shared storage
    default: true


  storage.island:
    description: Manage the shared island storage
    default: true

  storage.donate.craft:
    description: Use the Crafter button (craft stored items into blocks)
    default: false
