#Storage & Main Configuration
#If you encounter any issues, please report them to me at: https://github.com/TheBlueSkyARL/Storage/issues

#Do not touch it
config_version: 10

#Database configuration
database:
  #Database type: sqlite, yml, mysql
  #Required: Restart server to apply changes
  type: sqlite
  
  #MySQL configuration (only used when type is mysql)
  mysql:
    host: "localhost"
    port: "3306"
    database: "storage"
    username: "root"
    password: ""
    useSSL: false

# Worlds that will not be affected by the plugin
blacklist_world:
  - defaultworld
  - exampleworld

#Send a notification to console when a new version is available
check_update: true

#Prefix for every message from plugin
prefix: "&7[&6Storage&7]"

settings:
  #Default max storage for all item
  default_max_storage: 100000
  #How to resolve max storage between database/commands and permissions.
  # PERMISSION: Always use permission-based value.
  # DATABASE: Always use database value (set by /storage max or external systems).
  # MAX: Use the higher value between permission and database.
  # MIN: Use the lower value between permission and database.
  # Default: PERMISSION
  max_storage_mode: MAX
  #Default auto pickup on first join
  default_auto_pickup: false
  #Storage full notification settings
  storage_full_notification:
    #Enable storage full notification when mining
    enabled: true
    #Cooldown in seconds between notifications (minimum: 1 second)
    cooldown_seconds: 10
  #Reset command notification settings
  reset_notification:
    #Send notification to target player when their storage is reset by admin
    notify_target_player: true

hooks:
  mmoitems_autosmelt:
    # Enable MMOItems AutoSmelt integration.
    #
    # When enabled, Storage can use an alternative drop mapping for blocks
    # when the player's tool has the MMOItems AutoSmelt flag.
    #
    # Notes:
    # - Requires MMOItems + MythicLib installed.
    # - If disabled, Storage will ignore MMOItems AutoSmelt and always use
    #   the normal 'drop' mapping.
    enabled: true

# Storage limit based on permissions
# Players with permission storage.storage.<tier_name> will receive the configured max_storage
# Priority system: higher number = higher priority (overrides lower priority)
# If the player has multiple storage limit permissions, the highest priority will be used
# If no storage limit permission is found, settings.default_max_storage will be used
storage_permissions:
  vip:
    max_storage: 10000
    priority: 1
  premium:
    max_storage: 50000
    priority: 2
  ultimate:
    max_storage: 200000
    priority: 3
  # You can add more permissions here.
  # abc:
  #  max_storage: 5000
  #  priority: 4

#Auto save player data settings
auto_save:
  #Enable auto save feature
  enabled: true
  #Auto save interval in minutes (minimum: 1 minute)
  interval_minutes: 5
  #Save data asynchronously to prevent lag
  async: true
  #Log auto save activity to console
  log_activity: false

# Sell commands executed when paying via `commands` method or when fallback happens.
# Placeholders:
# - #player# : player name
# - #money#  : formatted amount (see number_format)
#
# Example (Vault/Essentials):
# - "eco give #player# #money#"
sell:
  - "eco give #player# #money#"

# Sell payout method (global default)
# - commands: Execute configured sell commands (default)
# - vault: Deposit money via Vault economy; fallback to commands if Vault is unavailable or fails
# - playerpoints: Give points via PlayerPoints; fallback to commands if PlayerPoints is unavailable or fails
#
# Note: You can override the payout method per material in `worth:` using "<price>;<method>".
sell_method: commands

auto_sell:
  enabled: true
  # Default delay in seconds between auto-sell checks per item.
  # You can override per-player with permissions:
  # - storage.autosell.delay.<seconds>
  default_delay: 5.0
  # Trigger mode:
  # - BOTH: autosell triggers on deposit AND when enabling autosell for an existing item.
  # - DEPOSIT_ONLY: autosell triggers only when items are added into Storage (autopickup/deposit).
  # - TOGGLE_ONLY: autosell triggers only when enabling autosell for an item that already exists in Storage.
  # - DISABLED: autosell never triggers automatically.
  trigger: BOTH

#Number format of worth
number_format: "#.##"

#Prevent re-place and re-break block to get more item
prevent_rebreak: false

#Fortune enchantment can apply for list block(s) below here
whitelist_fortune:
  - COAL_ORE
  - IRON_ORE
  - GOLD_ORE
  - REDSTONE_ORE
  - LAPIS_ORE
  - DIAMOND_ORE
  - EMERALD_ORE
 # For higher version
#  - NETHER_QUARTZ_ORE
#  - ANCIENT_DEBRIS
#  - COPPER_ORE

#Worth of per item
# Format:
# - Default: <price>
# - With per-item payout override: "<price>;<method>" where method is one of: commands | vault | playerpoints
#   (This overrides sell_method ONLY for that material)
# Examples:
# - COBBLESTONE;0: 1
# - DIAMOND;0: "7;vault"
# - EMERALD;0: "8;playerpoints"
worth:
  COBBLESTONE;0: 1
  COAL;0: 2
  COAL_BLOCK;0: 18
  IRON_INGOT;0: 3
  IRON_BLOCK;0: 27
  GOLD_INGOT;0: 4
  GOLD_BLOCK;0: 36
  REDSTONE;0: 5
  REDSTONE_BLOCK;0: 45
  LAPIS_LAZULI;0: 6
  LAPIS_BLOCK;0: 54
  DIAMOND;0: 7
  DIAMOND_BLOCK;0: 43
  EMERALD;0: 8
  EMERALD_BLOCK;0: 72
 # For higher version
#  QUARTZ;0: 6
#  QUARTZ_BLOCK;0: 54
#  NETHERITE_INGOT;0: 50
#  NETHERITE_BLOCK;0: 450
#  NETHERITE_SCRAP;0: 12
#  COPPER_INGOT;0: 3
#  COPPER_BLOCK;0: 27

#Player can storage list blocks below here
blocks:
  #MUST REMEMBER: DON'T CONFIG 2 SAME MATERIAL_1 BELOW THIS!
  #MATERIAL_1;DATA_NUMBER:
  # drop: MATERIAL_2;DATA_NUMBER
  # drop_autosmelt: MATERIAL_3;DATA_NUMBER
  #For 1.12.2 and below, MATERIAL;0 | 0 -> item data
  #For example, If you want LAPIS_LAZULI for 1.12.2 and below -> INK_SACK;4
  #If you want diamond for all versions -> DIAMOND;0
  #Don't remove ;0 if you don't want to make a new issue!
  #
  # Optional:
  # - drop_autosmelt is used ONLY when the player is using an MMOItems tool
  #   with AutoSmelt enabled. This allows you to configure different drops
  #   for normal tools vs AutoSmelt tools.
  #
  # Example (1.17+):
  # - Normal pickaxe: IRON_ORE -> RAW_IRON
  # - MMOItems AutoSmelt pickaxe: IRON_ORE -> IRON_INGOT
  #
  # IRON_ORE;0:
  #   drop: RAW_IRON;0
  #   drop_autosmelt: IRON_INGOT;0
  COBBLESTONE;0:
    drop: COBBLESTONE;0
  STONE;0:
    drop: COBBLESTONE;0
  COAL_ORE;0:
    drop: COAL;0
  COAL_BLOCK;0:
    drop: COAL_BLOCK;0
  IRON_ORE;0:
    drop: IRON_INGOT;0
  IRON_BLOCK;0:
    drop: IRON_BLOCK;0
  GOLD_ORE;0:
    drop: GOLD_INGOT;0
  GOLD_BLOCK;0:
    drop: GOLD_BLOCK;0
  REDSTONE_ORE;0:
    drop: REDSTONE;0
  REDSTONE_BLOCK;0:
    drop: REDSTONE_BLOCK;0
  LAPIS_ORE;0:
    drop: LAPIS_LAZULI;0
  LAPIS_BLOCK;0:
    drop: LAPIS_BLOCK;0
  DIAMOND_ORE;0:
    drop: DIAMOND;0
  DIAMOND_BLOCK;0:
    drop: DIAMOND_BLOCK;0
  EMERALD_ORE;0:
    drop: EMERALD;0
  EMERALD_BLOCK;0:
    drop: EMERALD_BLOCK;0
  # For higher version
#  NETHER_QUARTZ_ORE;0:
#    drop: QUARTZ;0
#  QUARTZ_BLOCK;0:
#    drop: QUARTZ_BLOCK;0
#  ANCIENT_DEBRIS;0:
#    drop: NETHERITE_SCRAP;0
#  NETHERITE_BLOCK;0:
#    drop: NETHERITE_BLOCK;0
#  COPPER_ORE;0:
#    drop: COPPER_INGOT;0
#  COPPER_BLOCK;0:
#    drop: COPPER_BLOCK;0

items:
  COBBLESTONE;0: "&7Cobblestone"
  COAL;0: "&8Coal"
  COAL_BLOCK;0: "&8Coal Block"
  IRON_INGOT;0: "&fIron Ingot"
  IRON_BLOCK;0: "&fIron Block"
  GOLD_INGOT;0: "&eGolden Ingot"
  GOLD_BLOCK;0: "&eGold Block"
  REDSTONE;0: "&cRedstone"
  REDSTONE_BLOCK;0: "&cRedstone Block"
  LAPIS_LAZULI;0: "&1Lapis Lazuli"
  LAPIS_BLOCK;0: "&1Lapis Block"
  DIAMOND;0: "&bDiamond"
  DIAMOND_BLOCK;0: "&bDiamond Block"
  EMERALD;0: "&aEmerald"
  EMERALD_BLOCK;0: "&aEmerald Block"
 # For higher version
#  QUARTZ;0: "&fNether Quartz"
#  QUARTZ_BLOCK;0: "&fQuartz Block"
#  NETHERITE_INGOT;0: "&4Netherite Ingot"
#  NETHERITE_BLOCK;0: "&4Netherite Block"
#  NETHERITE_SCRAP;0: "&4Netherite Scrap"
#  COPPER_INGOT;0: "&6Copper Ingot"
#  COPPER_BLOCK;0: "&6Copper Block"

mine:
  title:
    enable: true
    title: "&e+#amount# #item#"
    subtitle: "&b#storage#/#max#"
  actionbar:
    enable: true
    action: "&6+#amount# #item# [#storage#/#max#]"
  # Combine multiple picked-up items into one notification within a short window
  combine:
    enable: true
    # Max items displayed in a single notification
    max_items: 3
    # Max wait (in seconds) from the first picked-up item before sending.
    # Items merge while pickups keep coming and are sent ~0.1s after the last pickup,
    # so 0 = no visible delay while still combining bursts (vein-mine/TNT, ground-store).
    duration_seconds: 0
    # Separator between entries (use "\n" for multiline subtitle on 1.20.3+)
    separator: " "

# Animation for particles: none, circle, spiral, line, burst, helix, wave, dna_helix, galaxy, tornado, lightning, geometric_star
transfer:
  enabled: true
  delay: 3
  max_history_display: 10
  particles:
    enabled: true
    processing:
      animation: "circle"
      type: "ENCHANTMENT_TABLE"
      count: 8
      speed: 0.1
      radius: 1.5
      duration: 3
    beam:
      animation: "line"
      type: "FIREWORKS_SPARK"
      count: 3
      speed: 0.2
      duration: 3
    success:
      animation: "burst"
      type: "VILLAGER_HAPPY"
      count: 15
      speed: 0.1
      radius: 2.0
    receive:
      animation: "circle"
      type: "HEART"
      count: 8
      speed: 0.1
      radius: 1.2
    failed:
      animation: "burst"
      type: "SMOKE_NORMAL"
      count: 12
      speed: 0.15
      radius: 1.8
  sounds:
    enabled: true
    success:
      name: "ORB_PICKUP"
      volume: 1.0
      pitch: 1.2
    receive:
      name: "ITEM_PICKUP"
      volume: 0.8
      pitch: 1.0
    failed:
      name: "VILLAGER_NO"
      volume: 0.8
      pitch: 0.8

# Convert materials settings
convert:
  enabled: true
  # Default conversion ratios
  default_ratios:
    # Ingot to Block ratio (how many ingots needed for 1 block)
    ingot_to_block: 9
    # Block to Ingot ratio (how many ingots you get from 1 block)
    block_to_ingot: 9
  # Custom conversion mappings (optional - if not specified, auto-detection will be used)
  # Format: "ingot_material": "block_material"
  custom_mappings:
    # Example: "CUSTOM_INGOT;0": "CUSTOM_BLOCK;0"
  # Custom ratios for specific materials (optional)
  # Format: "ingot_material_block_material": { ingot_to_block: X, block_to_ingot: Y }
  custom_ratios:
#    # Quartz uses 4:1 ratio instead of default 9:1
#    "QUARTZ;0_QUARTZ_BLOCK;0":
#      ingot_to_block: 4
#      block_to_ingot: 4
#    # Netherite is more expensive - 36:1 ratio
#    "NETHERITE_SCRAP;0_NETHERITE_BLOCK;0":
#      ingot_to_block: 36
#      block_to_ingot: 36
  particles:
    enabled: true
    animation: "helix"
    type: "ENCHANTMENT_TABLE"
    count: 12
    speed: 0.1
    radius: 1.8
    duration: 2
  sounds:
    enabled: true
    name: "BLOCK_ANVIL_USE"
    volume: 1.0
    pitch: 1.2

sounds:
  enabled: true
  gui:
    click:
      sound: "UI_BUTTON_CLICK"
      volume: 0.5
      pitch: 1.0
    open:
      sound: "BLOCK_CHEST_OPEN"
      volume: 0.6
      pitch: 1.0
    close:
      sound: "BLOCK_CHEST_CLOSE"
      volume: 0.6
      pitch: 1.0
  action:
    success:
      sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
      volume: 0.7
      pitch: 1.2
    error:
      sound: "ENTITY_VILLAGER_NO"
      volume: 0.8
      pitch: 0.8
    deposit:
      sound: "ENTITY_ITEM_PICKUP"
      volume: 0.6
      pitch: 1.1
    withdraw:
      sound: "ITEM_ARMOR_EQUIP_LEATHER"
      volume: 0.6
      pitch: 1.0
    sell:
      sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
      volume: 0.7
      pitch: 1.5
  navigation:
    sound: "UI_BUTTON_CLICK"
    volume: 0.4
    pitch: 1.2
  chat_actions:
    deposit:
      enabled: true
      name: "ENTITY_ITEM_PICKUP"
      volume: 0.6
      pitch: 1.1
    withdraw:
      enabled: true
      name: "ITEM_ARMOR_EQUIP_LEATHER"
      volume: 0.6
      pitch: 1.0
    sell:
      enabled: true
      name: "ENTITY_EXPERIENCE_ORB_PICKUP"
      volume: 0.7
      pitch: 1.5
    error:
      enabled: true
      name: "ENTITY_VILLAGER_NO"
      volume: 0.8
      pitch: 0.8

# Shared island storage (requires SuperiorSkyblock2).
# All members of an island use the storage of the island owner. Members can always auto-pickup and withdraw.
island_storage:
  enabled: true
  # Whether island members may sell items unless the owner decides otherwise (/storage island sell <player> <on|off>).
  default_member_sell: false

# Crafter button: turns stored items into blocks inside the storage (never uses the player's inventory).
# Recipes are processed in this order; both items must exist in the storage (blocks/items sections).
crafter:
  enabled: true
  # Permission required to use the Crafter button (Donate rank). Empty = everyone.
  permission: "storage.donate.craft"
  recipes:
    IRON_INGOT;0:
      block: IRON_BLOCK;0
      amount: 9
    GOLD_INGOT;0:
      block: GOLD_BLOCK;0
      amount: 9
    DIAMOND;0:
      block: DIAMOND_BLOCK;0
      amount: 9
    EMERALD;0:
      block: EMERALD_BLOCK;0
      amount: 9
    COAL;0:
      block: COAL_BLOCK;0
      amount: 9
    REDSTONE;0:
      block: REDSTONE_BLOCK;0
      amount: 9
    LAPIS_LAZULI;0:
      block: LAPIS_BLOCK;0
      amount: 9

# Total capacity upgrades (Copper Golem button, Shift + left click).
# Capacity counts ALL items together. A level's capacity replaces the base capacity only when it is higher.
# Cost is charged through Vault; permission is optional (empty = none). Only the island owner can upgrade.
storage_upgrade:
  enabled: true
  levels:
    1:
      capacity: 200000
      cost: 50000
      permission: ""
    2:
      capacity: 500000
      cost: 150000
      permission: ""
    3:
      capacity: 1000000
      cost: 400000
      permission: ""

# Languages: files live in plugins/Storage/lang/<code>.yml (UTF-8). Add a file there and list its code below
# to support another language; players choose with /storage lang <code>.
language:
  # Server default (also used for the console)
  default: "vi_VN"
  available:
    - "en_US"
    - "vi_VN"
  # Let every player choose their own language
  per-player: true
  # Use the Minecraft client language for players who have not chosen one
  use-client-locale: false
  # Used when a key is missing in the selected language
  fallback: "en_US"
